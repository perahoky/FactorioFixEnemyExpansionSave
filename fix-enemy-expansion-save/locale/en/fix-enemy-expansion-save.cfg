[mod-setting-name]
feas-dry-run=Report only, change nothing
feas-enabled-mode=Expansion on/off flag
feas-min-cooldown=Minimum expansion cooldown (ticks)
feas-max-cooldown=Maximum expansion cooldown (ticks)
feas-settler-min=Settler group minimum size
feas-settler-max=Settler group maximum size
feas-min-distance=Minimum expansion distance (chunks)
feas-max-distance=Maximum expansion distance (chunks)
feas-kill-scope=Kill leftover enemy units

[mod-setting-description]
feas-dry-run=Report the differences in chat and in the log, but do not write anything into the map. Use this first if you want to see what would change.
feas-enabled-mode=Whether enemy expansion is switched on at all. "Leave as-is" never touches the flag, which is the safe choice unless you know how your map was generated.
feas-min-cooldown=Shortest time between expansion attempts. Factorio 2.1 base uses 36000 (10 minutes).
feas-max-cooldown=Longest time between expansion attempts. Factorio 2.1 base uses 216000 (60 minutes).
feas-settler-min=Lower bound for the size of a group that leaves to build a new nest. Factorio 2.1 base uses 5.
feas-settler-max=Upper bound for the size of a group that leaves to build a new nest. Factorio 2.1 base uses 10.
feas-min-distance=How far from the outermost existing nest a new one must be. Factorio 2.1 base uses 3.
feas-max-distance=How far from the outermost existing nest a new one may be. Factorio 2.1 base uses 5.
feas-kill-scope=One-shot cleanup of enemy units left behind by a removed mod. Nests and worms are never touched. Runs once when you switch this away from "Don't touch units".

[string-mod-setting]
feas-enabled-mode-leave=Leave as-is
feas-enabled-mode-on=Force on
feas-enabled-mode-off=Force off
feas-kill-scope-none=Don't touch units
feas-kill-scope-nauvis=Nauvis only
feas-kill-scope-all=All surfaces
